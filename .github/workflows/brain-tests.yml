
name: BH-OMNI CORE Brain Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-brain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python version
        run: python --version

      - name: Check Python syntax
        run: python -m compileall -q brain tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run brain core tests
        run: python -m unittest brain.test_brain_core -v

      - name: Run basic brain tests
        run: python -m brain.test_brain

      - name: Run health check
        run: python -m brain.health_check
